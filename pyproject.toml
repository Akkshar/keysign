[project]
name = "keysign"
version = "0.1.0"
description = "Behavioral vital-signs engine from keystroke timing"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pywebview>=6.2.1",
    "pystray>=0.19.5",
    "pynput>=1.8.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.62.0",
]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "backend/tests"]

[tool.uv]
package = false
