<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d4ed8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z'/%3E%3Ccircle cx='16.5' cy='7.5' r='.5' fill='%231d4ed8'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeySign — Privacy-First Typing Behavior & Health Screening</title>
    <!-- Every face is served from this machine (public/fonts and the icon font in
         main.tsx). Nothing is fetched from Google: the dashboard must render with
         the network off, and a page about on-device processing should not phone out. -->
    <!-- Dark mode has to be decided before the first paint. React adds the class in
         an effect, which is at least one frame too late: the window painted the light
         canvas, then the light background, then went dark. That is the white flash on
         every reload, and the app window reloads often. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('keysign-theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#121210';
          } else {
            document.documentElement.style.colorScheme = 'light';
            document.documentElement.style.backgroundColor = '#faf8f5';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Chillax-Variable.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Zodiak-Variable.woff2" crossorigin />
  </head>
  <body class="bg-background text-on-surface antialiased selection:bg-primary-fixed selection:text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
